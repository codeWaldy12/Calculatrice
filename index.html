<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/responsive.css">
    <script src="https://kit.fontawesome.com/f086ab3604.js" crossorigin="anonymous"></script>
    <title>Calculatrice</title>
</head>
<body>

    <aside class="sidebar">

        <h1 class="sidebar__logo">Super Calculatrice</h1>

        <nav class="navbar">
            <a href="index.html" title="Standard" aria-label="Calculatrice standard">
                <i class="fa-solid fa-gear" aria-hidden="true"></i>
                <span class="navbar__label">Standard</span>
            </a>
            <a href="pages/scientifique.html" title="Scientifique" aria-label="Calculatrice scientifique">
                <i class="fa-solid fa-flask" aria-hidden="true"></i>
                <span class="navbar__label">Scientifique</span>
            </a>
            <a href="pages/historique.html" title="Historique" aria-label="Historique des calculs">
                <i class="fa-solid fa-clock-rotate-left" aria-hidden="true"></i>
                <span class="navbar__label">Historique</span>
            </a>
        </nav>

    </aside>

    <main class="standard">

        <div class="standard__cadre">
            <output class="standard__ecran"  
                aria-label="Résultat du calcul"
                aria-live="polite">0</output>
        </div>
        
        <div class="standard__clavier">

            <button class="btn operateur__special" value="ac">AC</button>

            <button class="btn operateur__special" value="+/-">+/-</button>

            <button class="btn operateur__arithmetique" value="%">%</button>

            <button class="btn operateur__arithmetique" value="/">/</button>

            <button class="btn btn__num" value="7">7</button>

            <button class="btn btn__num" value="8">8</button>

            <button class="btn btn__num" value="9">9</button>

            <button class="btn operateur__arithmetique" value="*">x</button>

            <button class="btn btn__num" value="4">4</button>

            <button class="btn btn__num" value="5">5</button>

            <button class="btn btn__num" value="6">6</button>

            <button class="btn operateur__arithmetique" value="-">-</button>

            <button class="btn btn__num" value="1">1</button>

            <button class="btn btn__num" value="2">2</button>

            <button class="btn btn__num" value="3">3</button>

            <button class="btn operateur__arithmetique" value="+">+</button>

            <button class="btn btn__num standard__clavier-zero" value="0">0</button>

            <button class="btn virgule" value=".">.</button>

            <button class="btn operateur__egal" value="=">=</button>

        </div>
    
    </main>

    <script type="module" src="js/main.js"></script>
</body>
</html>
